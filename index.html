<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bike — What Size Am I?</title>
  <meta name="description" content="Find your bike size in 10 seconds. Enter your height and instantly see your size across every bike category.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%221%22 x2=%221%22 y2=%220%22><stop offset=%220%22 stop-color=%22%23f97316%22/><stop offset=%221%22 stop-color=%22%23fbbf24%22/></linearGradient><radialGradient id=%22bg%22 cx=%2230%25%22 cy=%2220%25%22 r=%2285%25%22><stop offset=%220%22 stop-color=%22%23182a4d%22/><stop offset=%221%22 stop-color=%22%230a0f1e%22/></radialGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22url(%23bg)%22/><circle cx=%2230%22 cy=%2268%22 r=%2216%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%228%22/><circle cx=%2270%22 cy=%2268%22 r=%2216%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%228%22/><path d=%22M46,32 L44,60 M46,32 L62,40 M62,40 L44,60 M44,60 L30,68 M46,32 L30,68 M62,40 L70,68%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%221%22 x2=%221%22 y2=%220%22><stop offset=%220%22 stop-color=%22%23f97316%22/><stop offset=%221%22 stop-color=%22%23fbbf24%22/></linearGradient><radialGradient id=%22bg%22 cx=%2230%25%22 cy=%2220%25%22 r=%2285%25%22><stop offset=%220%22 stop-color=%22%23182a4d%22/><stop offset=%221%22 stop-color=%22%230a0f1e%22/></radialGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22url(%23bg)%22/><circle cx=%2230%22 cy=%2268%22 r=%2216%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%228%22/><circle cx=%2270%22 cy=%2268%22 r=%2216%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%228%22/><path d=%22M46,32 L44,60 M46,32 L62,40 M62,40 L44,60 M44,60 L30,68 M46,32 L30,68 M62,40 L70,68%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
</head>
<body>

  <header>
    <div class="logo">
      <svg class="logo-icon" width="22" height="22" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#f97316"/>
            <stop offset="1" stop-color="#fbbf24"/>
          </linearGradient>
        </defs>
        <circle cx="30" cy="68" r="16" fill="none" stroke="url(#logoGrad)" stroke-width="8"/>
        <circle cx="70" cy="68" r="16" fill="none" stroke="url(#logoGrad)" stroke-width="8"/>
        <path d="M46,32 L44,60 M46,32 L62,40 M62,40 L44,60 M44,60 L30,68 M46,32 L30,68 M62,40 L70,68" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>My Bike</span>
    </div>
    <h1>What size bike am I?</h1>
    <p class="tagline">Move the slider to your height — we'll handle the rest.</p>
  </header>

  <main>

    <section class="height-section" aria-label="Height input">
      <div class="unit-toggle" role="group" aria-label="Height unit">
        <button id="toggle-imperial" class="active" aria-pressed="true">ft / in</button>
        <button id="toggle-metric" aria-pressed="false">cm</button>
      </div>

      <div class="height-display" aria-live="polite" aria-atomic="true">
        <span id="height-primary"></span>
        <span id="height-secondary"></span>
      </div>

      <div class="slider-wrapper">
        <input
          type="range"
          id="height-slider"
          min="54"
          max="80"
          value="69"
          step="1"
          aria-label="Your height"
        >
      </div>
      <div class="slider-labels" aria-hidden="true">
        <span id="slider-label-min"></span>
        <span id="slider-label-max"></span>
      </div>
    </section>

    <section class="results-section" aria-label="Bike size results">
      <p class="results-intro">Your size across bike types</p>
      <div id="results-grid" class="results-grid"></div>
    </section>

    <section class="brand-section" aria-label="Brand check">
      <details>
        <summary>Know your brand? (optional)</summary>
        <div class="brand-input-wrapper">
          <input
            type="text"
            id="brand-input"
            placeholder="e.g. Trek, Specialized, Giant…"
            autocomplete="off"
            aria-label="Bike brand name"
          >
          <button id="brand-btn" type="button">Check</button>
        </div>
        <div id="brand-note" role="status" aria-live="polite"></div>
      </details>
    </section>

  </main>

  <footer>
    <p>Sizing varies by manufacturer. These ranges are general guidelines — always check your brand's official chart before buying.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
