<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bike — What Size Am I?</title>
  <meta name="description" content="Find your bike size in 10 seconds. Enter your height and instantly see your size across every bike category.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%221%22 x2=%221%22 y2=%220%22><stop offset=%220%22 stop-color=%22%23fb923c%22/><stop offset=%221%22 stop-color=%22%23f59e0b%22/></linearGradient><radialGradient id=%22bg%22 cx=%220.3%22 cy=%220.2%22 r=%220.95%22><stop offset=%220%22 stop-color=%22%23213a6b%22/><stop offset=%221%22 stop-color=%22%230a0f1e%22/></radialGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22url(%23bg)%22/><g fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2230%22 cy=%2264%22 r=%2218%22/><circle cx=%2270%22 cy=%2264%22 r=%2218%22/><path d=%22M30,64 L50,64 L41,39 L63,41 Z%22/><line x1=%2241%22 y1=%2239%22 x2=%2230%22 y2=%2264%22/><line x1=%2263%22 y1=%2241%22 x2=%2270%22 y2=%2264%22/><line x1=%2236%22 y1=%2239%22 x2=%2246%22 y2=%2239%22/><path d=%22M63,41 L60,32 L69,32 q4,0 3,6%22/></g><circle cx=%2250%22 cy=%2264%22 r=%222.6%22 fill=%22url(%23g)%22/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%221%22 x2=%221%22 y2=%220%22><stop offset=%220%22 stop-color=%22%23fb923c%22/><stop offset=%221%22 stop-color=%22%23f59e0b%22/></linearGradient><radialGradient id=%22bg%22 cx=%220.3%22 cy=%220.2%22 r=%220.95%22><stop offset=%220%22 stop-color=%22%23213a6b%22/><stop offset=%221%22 stop-color=%22%230a0f1e%22/></radialGradient></defs><rect width=%22100%22 height=%22100%22 fill=%22url(%23bg)%22/><g fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%225%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2230%22 cy=%2264%22 r=%2218%22/><circle cx=%2270%22 cy=%2264%22 r=%2218%22/><path d=%22M30,64 L50,64 L41,39 L63,41 Z%22/><line x1=%2241%22 y1=%2239%22 x2=%2230%22 y2=%2264%22/><line x1=%2263%22 y1=%2241%22 x2=%2270%22 y2=%2264%22/><line x1=%2236%22 y1=%2239%22 x2=%2246%22 y2=%2239%22/><path d=%22M63,41 L60,32 L69,32 q4,0 3,6%22/></g><circle cx=%2250%22 cy=%2264%22 r=%222.6%22 fill=%22url(%23g)%22/></svg>">
</head>
<body>

  <header>
    <div class="logo">
      <svg class="logo-icon" width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#fb923c"/>
            <stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="30" cy="64" r="18"/>
          <circle cx="70" cy="64" r="18"/>
          <path d="M30,64 L50,64 L41,39 L63,41 Z"/>
          <line x1="41" y1="39" x2="30" y2="64"/>
          <line x1="63" y1="41" x2="70" y2="64"/>
          <line x1="36" y1="39" x2="46" y2="39"/>
          <path d="M63,41 L60,32 L69,32 q4,0 3,6"/>
        </g>
        <circle cx="50" cy="64" r="3" fill="url(#logoGrad)"/>
      </svg>
      <span>My Bike</span>
    </div>
    <h1>What size bike am I?</h1>
    <p class="tagline">Move the slider to your height — we'll handle the rest.</p>
  </header>

  <main>

    <section class="height-section" aria-label="Height input">
      <div class="unit-toggle" role="group" aria-label="Height unit">
        <button id="toggle-imperial" class="active" aria-pressed="true">ft / in</button>
        <button id="toggle-metric" aria-pressed="false">cm</button>
      </div>

      <div class="height-display" aria-live="polite" aria-atomic="true">
        <span id="height-primary"></span>
        <span id="height-secondary"></span>
      </div>

      <div class="slider-wrapper">
        <input
          type="range"
          id="height-slider"
          min="54"
          max="80"
          value="69"
          step="1"
          aria-label="Your height"
        >
      </div>
      <div class="slider-labels" aria-hidden="true">
        <span id="slider-label-min"></span>
        <span id="slider-label-max"></span>
      </div>
    </section>

    <section class="results-section" aria-label="Bike size results">
      <p class="results-intro">Your size across bike types</p>
      <div id="results-grid" class="results-grid"></div>
    </section>

    <section class="brand-section" aria-label="Brand check">
      <details>
        <summary>Know your brand? (optional)</summary>
        <div class="brand-input-wrapper">
          <input
            type="text"
            id="brand-input"
            placeholder="e.g. Trek, Specialized, Giant…"
            autocomplete="off"
            aria-label="Bike brand name"
          >
          <button id="brand-btn" type="button">Check</button>
        </div>
        <div id="brand-note" role="status" aria-live="polite"></div>
      </details>
    </section>

  </main>

  <footer>
    <p>Sizing varies by manufacturer. These ranges are general guidelines — always check your brand's official chart before buying.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
